name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delete-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, linux, x64, chromium]
    timeout-minutes: 360

    steps:
      - name: Checkout Delete
        uses: actions/checkout@v4

      - name: Bootstrap pinned Chromium
        env:
          INSTALL_BUILD_DEPS: "1"
        run: bash scripts/bootstrap.sh

      - name: Apply downstream patches
        run: bash scripts/apply-patches.sh

      - name: Build unsigned APK
        run: bash scripts/build.sh

      - name: Verify Library artifact contract
        run: bash scripts/verify-artifact.sh

      - name: Deliver unsigned APK to Library
        uses: actions/upload-artifact@v4
        with:
          name: library-unsigned-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
