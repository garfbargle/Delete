name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux, x64, chromium]
    timeout-minutes: 360

    steps:
      - name: Checkout Delete
        uses: actions/checkout@v4

      - name: Bootstrap pinned Chromium
        env:
          INSTALL_BUILD_DEPS: "1"
        run: bash scripts/bootstrap.sh

      - name: Apply downstream patches
        run: bash scripts/apply-patches.sh

      - name: Build APK
        run: bash scripts/build.sh

      - name: Publish explicit release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*.apk
            artifacts/*.sha256
